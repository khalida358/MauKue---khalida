<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout | MauKue</title>
  <meta name="description" content="Checkout pesanan kue MauKue dengan pickup atau delivery.">
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/customer.css">
</head>
<body data-page="customer-checkout" data-root="..">
  <header id="site-header" class="site-header"></header>

  <main class="page-shell">
    <div class="shell">
      <div class="page-head compact">
        <div><span class="eyebrow">Satu langkah lagi</span><h1>Checkout</h1><p>Isi informasi penerima dan jadwal. Pesanan baru tersimpan setelah kamu menekan tombol konfirmasi.</p></div>
        <a class="text-link" href="cart.html">← Kembali ke keranjang</a>
      </div>

      <div class="checkout-layout">
        <form class="panel checkout-form" id="checkout-form" novalidate>
          <div class="panel-head"><h2>Informasi pemesanan</h2><span>01</span></div>
          <div class="form-grid">
            <div class="field">
              <label for="checkout-name">Nama penerima</label>
              <input id="checkout-name" name="name" autocomplete="name" required placeholder="Nama lengkap">
            </div>
            <div class="field">
              <label for="checkout-phone">Nomor WhatsApp</label>
              <input id="checkout-phone" name="phone" inputmode="tel" autocomplete="tel" required placeholder="08xxxxxxxxxx">
            </div>
          </div>

          <div class="field">
            <label>Metode penerimaan</label>
            <div class="method-row">
              <label class="method-card selected" data-method="pickup">
                <input type="radio" name="method" value="pickup" checked>
                <span class="method-icon">🏪</span>
                <strong>Pickup</strong>
                <small>Ambil di toko</small>
              </label>
              <label class="method-card" data-method="delivery">
                <input type="radio" name="method" value="delivery">
                <span class="method-icon">🛵</span>
                <strong>Delivery</strong>
                <small>Dikirim ke alamat</small>
              </label>
            </div>
          </div>

          <div id="delivery-fields" hidden>
            <div class="field">
              <label for="saved-address">Alamat tersimpan <span class="optional">(opsional)</span></label>
              <select id="saved-address"></select>
            </div>
            <div class="field">
              <label for="checkout-address">Alamat pengiriman lengkap</label>
              <textarea id="checkout-address" name="address" rows="3" placeholder="Nama jalan, nomor rumah, patokan, kelurahan, kota"></textarea>
            </div>
          </div>

          <div class="form-grid">
            <div class="field">
              <label for="checkout-date">Tanggal pengambilan / pengiriman</label>
              <input id="checkout-date" name="date" type="date" required>
            </div>
            <div class="field">
              <label for="checkout-time">Waktu</label>
              <select id="checkout-time" name="time" required></select>
            </div>
          </div>

          <div class="field">
            <label for="checkout-notes">Catatan untuk penjual <span class="optional">(opsional)</span></label>
            <textarea id="checkout-notes" name="notes" rows="3" placeholder="Contoh: tolong tambahkan lilin angka 25, atau hubungi sebelum mengantar."></textarea>
          </div>

          <div class="notice-strip">
            <strong>Pembayaran manual</strong>
            <span>DP dan pelunasan dikonfirmasi langsung oleh penjual. Website ini belum memproses pembayaran otomatis.</span>
          </div>

          <div class="form-error" id="checkout-error" role="alert"></div>
          <button class="btn btn-block" id="checkout-submit" type="submit">Konfirmasi pesanan</button>
        </form>

        <aside class="cart-summary" id="checkout-summary"></aside>
      </div>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="../js/utils.js"></script>
  <script src="../js/products.js"></script>
  <script src="../js/database.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/orders.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/customer.js"></script>
</body>
</html>
