<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Detail Produk | MauKue</title><link rel="stylesheet" href="../css/style.css"><script src="../js/products.js"></script><script src="../js/app.js"></script></head><body><header class="top"><a class="brand" href="../index.html">mau<span>kue</span></a><nav class="nav"><a href="../customer/dashboard.html">Beranda</a><a href="../customer/catalog.html">Katalog</a><a href="../customer/custom-order.html">Pesan custom</a><a href="../customer/orders.html">Pesanan</a><a href="../seller/dashboard.html">Area penjual</a></nav><a class="btn" href="../customer/cart.html">Keranjang</a></header><main class="shell page"><div id="detail" class="panel">Memuat produk...</div><script>let id=new URLSearchParams(location.search).get('id');let p=products.find(x=>x.id==id)||products[0];document.getElementById('detail').innerHTML=`<div class="form-grid"><img src="${p.image}" style="width:100%;max-height:480px;object-fit:cover;border-radius:14px"><div><div class="eyebrow">${p.category}</div><h1>${p.name}</h1><div class="price">${money(p.price)}</div><p class="muted">${p.desc||'Kue pilihan MauKue.'}</p><div class="field"><label>Ukuran</label><select id="size"><option>Mini</option><option>Regular</option><option>Jumbo</option></select></div><div class="field"><label>Rasa</label><select id="flavor"><option>Vanilla</option><option>Cokelat</option><option>Red Velvet</option><option>Matcha</option></select></div><button class="btn" onclick="addCart(${p.id})">Tambah ke keranjang</button></div></div>`</script></main><footer class="shell footer">MauKue · Kue custom sesukamu</footer></body></html>
