<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pesan Kue Custom | MauKue</title><link rel="stylesheet" href="../css/style.css"><script src="../js/products.js"></script><script src="../js/app.js"></script></head><body><header class="top"><a class="brand" href="../index.html">mau<span>kue</span></a><nav class="nav"><a href="../customer/dashboard.html">Beranda</a><a href="../customer/catalog.html">Katalog</a><a href="../customer/custom-order.html">Pesan custom</a><a href="../customer/orders.html">Pesanan</a><a href="../seller/dashboard.html">Area penjual</a></nav><a class="btn" href="../customer/cart.html">Keranjang</a></header><main class="shell page"><div class="section-title"><div><div class="eyebrow">Buat sesuai keinginanmu</div><h1>Form Pesanan Custom</h1></div></div><form class="panel" onsubmit="submitOrder(event)"><input type="hidden" name="custom" value="yes"><div class="form-grid"><div class="field"><label>Nama</label><input name="name" required></div><div class="field"><label>Nomor WhatsApp</label><input name="phone" required></div><div class="field"><label>Ukuran kue</label><select name="size"><option>Mini</option><option>Regular</option><option>Jumbo</option><option>2 tingkat</option><option>3 tingkat</option></select></div><div class="field"><label>Rasa</label><select name="flavor"><option>Vanilla</option><option>Cokelat</option><option>Red Velvet</option><option>Matcha</option></select></div><div class="field"><label>Warna utama</label><input name="color" placeholder="Contoh: butter yellow dan putih"></div><div class="field"><label>Perkiraan budget (Rp)</label><input name="budget" type="number" min="0" required></div><div class="field"><label>Tanggal dibutuhkan</label><input name="date" type="date" required></div><div class="field"><label>Waktu</label><input name="time" type="time" required></div></div><div class="field"><label>Desain, tulisan, dekorasi, dan catatan</lab
