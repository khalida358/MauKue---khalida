<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kelola Pesanan | MauKue</title><link rel="stylesheet" href="../css/style.css"><script src="../js/products.js"></script><script src="../js/app.js"></script></head><body><header class="top"><a class="brand" href="../index.html">mau<span>kue</span></a><nav class="nav"><a href="../customer/dashboard.html">Beranda</a><a href="../customer/catalog.html">Katalog</a><a href="../customer/custom-order.html">Pesan custom</a><a href="../customer/orders.html">Pesanan</a><a href="../seller/dashboard.html">Area penjual</a></nav><a class="btn" href="../customer/cart.html">Keranjang</a></header><main class="shell page"><h1>Kelola Pesanan</h1><p class="muted">Perbarui status pesanan setelah menghubungi pelanggan.</p><div class="panel"><table class="table"><thead><tr><th>Kode</th><th>Pelanggan</th><th>Item</th><th>Total</th><th>Status</th><th>Pembayaran</th><th>Ubah status</th></tr></thead><tbody id="seller-orders"></tbody></table></div><script>function showSellerOrders(){let a=get('orders',[]);document.getElementById('seller-orders').innerHTML=a.length?a.map(o=>`<tr><td>${o.id}</td><td>${o.customer}</td><td>${o.items.map(i=>i.name).join(', ')}</td><td>${money(o.total)}</td><td>${o.status}</td><td>${o.payment}</td><td><select onchange="updateStatus('${o.id}',this.value)"><option>${o.status}</option><option>Diproses</option><option>Dalam produksi</option><option>Siap diambil</option><option>Dalam pengantaran</option><option>Selesai</option><option>Dibatalkan</option></select></td></tr>`).join(''):'<tr><td colspan="7" class="empty">Belum ada pesanan masuk.</td></tr>'}showSellerOrders()</script></main><footer class="shell footer">MauKue · Kue custom sesukamu</footer></body></html>
