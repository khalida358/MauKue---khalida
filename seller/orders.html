<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kelola pesanan | MauKue Seller</title>
  <meta name="description" content="Kelola semua pesanan kue MauKue.">
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/seller.css">
</head>
<body data-page="seller-orders" data-root=".." class="seller-body">
  <div class="seller-layout">
    <aside id="seller-sidebar" class="seller-sidebar"></aside>
    <div class="seller-main">
      <header id="seller-topbar" class="seller-topbar"></header>
      <main class="seller-content">
        <div class="dash-page-head">
          <div><span class="eyebrow">Semua pesanan masuk</span><h1>Kelola pesanan</h1><p>Cari nomor pesanan atau nama pelanggan, lalu buka detail untuk memperbarui status.</p></div>
        </div>

        <div class="toolbar seller-toolbar">
          <div class="search-field"><span aria-hidden="true">⌕</span><input id="seller-order-search" type="search" placeholder="Cari kode, nama, atau nomor telepon..." aria-label="Cari pesanan"></div>
          <label class="sort-field">Status
            <select id="seller-order-status"></select>
          </label>
        </div>

        <section class="panel panel-table">
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>Pesanan</th><th>Pelanggan</th><th>Jadwal</th><th>Item</th><th>Total</th><th>Status</th><th>Aksi</th></tr></thead>
              <tbody id="seller-orders-body"></tbody>
            </table>
          </div>
        </section>
      </main>
      <footer class="seller-footer"><span>MauKue Seller Studio</span><span>Data demo tersimpan di browser</span></footer>
    </div>
  </div>

  <script src="../js/utils.js"></script>
  <script src="../js/products.js"></script>
  <script src="../js/database.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/orders.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/seller.js"></script>
</body>
</html>
