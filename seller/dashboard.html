<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard penjual | MauKue</title>
  <meta name="description" content="Dashboard penjual MauKue: pesanan, produksi, jadwal, dan pembayaran.">
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/seller.css">
</head>
<body data-page="seller-dashboard" data-root=".." class="seller-body">
  <div class="seller-layout">
    <aside id="seller-sidebar" class="seller-sidebar"></aside>
    <div class="seller-main">
      <header id="seller-topbar" class="seller-topbar"></header>
      <main class="seller-content">
        <div class="dash-page-head">
          <div>
            <span class="eyebrow">Ringkasan toko</span>
            <h1>Dashboard</h1>
            <p id="seller-greeting">Selamat datang kembali.</p>
          </div>
          <a class="btn" href="add-product.html">＋ Tambah produk</a>
        </div>

        <div class="stats-row" id="dashboard-stats"></div>

        <div class="dashboard-grid">
          <section class="panel panel-table">
            <div class="panel-head"><div><span class="eyebrow">Terbaru</span><h2>Pesanan terbaru</h2></div><a class="text-link" href="orders.html">Kelola semua →</a></div>
            <div class="table-wrap">
              <table class="data-table">
                <thead><tr><th>Kode</th><th>Pelanggan</th><th>Jadwal</th><th>Item</th><th>Total</th><th>Status</th><th></th></tr></thead>
                <tbody id="recent-orders-body"></tbody>
              </table>
            </div>
          </section>

          <aside class="dashboard-side">
            <section class="panel">
              <div class="panel-head"><div><span class="eyebrow">Terdekat</span><h2>Jadwal produksi</h2></div><a class="text-link" href="schedule.html">Lihat →</a></div>
              <div class="schedule-mini-list" id="upcoming-schedule"></div>
            </section>
            <section class="panel">
              <div class="panel-head"><div><span class="eyebrow">Log</span><h2>Aktivitas terbaru</h2></div></div>
              <div class="activity-list" id="recent-activity"></div>
            </section>
          </aside>
        </div>
      </main>
      <footer class="seller-footer"><span>MauKue Seller Studio</span><span>Data demo tersimpan di browser</span></footer>
    </div>
  </div>

  <script src="../js/utils.js"></script>
  <script src="../js/products.js"></script>
  <script src="../js/database.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/orders.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/seller.js"></script>
</body>
</html>
