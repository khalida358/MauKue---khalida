<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jadwal Produksi | MauKue</title><link rel="stylesheet" href="../css/style.css"><script src="../js/products.js"></script><script src="../js/app.js"></script></head><body><header class="top"><a class="brand" href="../index.html">mau<span>kue</span></a><nav class="nav"><a href="../customer/dashboard.html">Beranda</a><a href="../customer/catalog.html">Katalog</a><a href="../customer/custom-order.html">Pesan custom</a><a href="../customer/orders.html">Pesanan</a><a href="../seller/dashboard.html">Area penjual</a></nav><a class="btn" href="../customer/cart.html">Keranjang</a></header><main class="shell page"><h1>Jadwal Produksi</h1><p class="muted">Jadwal berdasarkan tanggal yang dipilih pelanggan.</p><div class="panel"><table class="table"><thead><tr><th>Tanggal</th><th>Waktu</th><th>Kode pesanan</th><th>Pelanggan</th><th>Item</th><th>Status</th></tr></thead><tbody id="schedule"></tbody></table></div><script>let a=get('orders',[]).sort((x,y)=>(x.date||'').localeCompare(y.date||''));document.getElementById('schedule').innerHTML=a.length?a.map(o=>`<tr><td>${o.date||'-'}</td><td>${o.time||'-'}</td><td>${o.id}</td><td>${o.customer}</td><td>${o.items.map(i=>i.name).join(', ')}</td><td>${o.status}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">Belum ada jadwal.</td></tr>'</script></main><footer class="shell footer">MauKue · Kue custom sesukamu</footer></body></html>
