<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jadwal produksi | MauKue Seller</title>
  <meta name="description" content="Jadwal produksi kue MauKue berdasarkan tanggal pesanan.">
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/seller.css">
</head>
<body data-page="seller-schedule" data-root=".." class="seller-body">
  <div class="seller-layout">
    <aside id="seller-sidebar" class="seller-sidebar"></aside>
    <div class="seller-main">
      <header id="seller-topbar" class="seller-topbar"></header>
      <main class="seller-content">
        <div class="dash-page-head">
          <div><span class="eyebrow">Urutan pengerjaan</span><h1>Jadwal produksi</h1><p>Pesanan dikelompokkan berdasarkan tanggal pengambilan atau pengiriman.</p></div>
          <label class="sort-field">Tampilkan
            <select id="schedule-filter">
              <option value="upcoming">Jadwal aktif</option>
              <option value="all">Semua pesanan</option>
            </select>
          </label>
        </div>
        <div id="schedule-root"></div>
      </main>
      <footer class="seller-footer"><span>MauKue Seller Studio</span><span>Data demo tersimpan di browser</span></footer>
    </div>
  </div>

  <script src="../js/utils.js"></script>
  <script src="../js/products.js"></script>
  <script src="../js/database.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/orders.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/seller.js"></script>
</body>
</html>
